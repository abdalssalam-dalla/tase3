<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2142">
<meta name="color-scheme" content="dark">
<title>بنك الأسئلة — الأستاذ عبد السلام دلله</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2142; --navy-2:#153B73; --gold:#C99A3B; --gold-lt:#EBCB7E; --gold-dk:#8E6A1E;
  --paper:#F1F4FA; --card:#FFFFFF; --ink:#0E1B33; --muted:#5A6786; --line:#DAE2F0;
  --pick:#0B2142; --pick-soft:#E8EFFC; --pick-ink:#0B2142;
  --ok:#0F7F52; --ok-soft:#DCF4E7; --bad:#C8353F; --bad-soft:#FDE5E7;
  --shadow:0 10px 28px rgba(11,33,66,.10);
  --btn-navy:#0B2142; --btn-navy-ink:#FFFFFF;
  --bb:calc(58px + env(safe-area-inset-top,0px));
  --cb:calc(60px + env(safe-area-inset-bottom,0px));
  --display:"El Messiri","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
}
:root[data-theme="dark"]{
  --paper:#071428; --card:#0E2142; --ink:#EAF0FF; --muted:#9DB0D6; --line:#203A68;
  --pick:#EBCB7E; --pick-soft:#16305C; --pick-ink:#EBCB7E;
  --ok:#4FD39A; --ok-soft:#0F3A2B; --bad:#FF7F88; --bad-soft:#40202B;
  --shadow:0 10px 28px rgba(0,0,0,.35);
  --btn-navy:#1C427D; --btn-navy-ink:#FFFFFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-behavior:smooth}
body{margin:0;padding-top:var(--bb);padding-bottom:calc(var(--cb) + 18px);min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.8;
  -webkit-text-size-adjust:100%;transition:background .3s,color .3s}
button{font:inherit;color:inherit}
.hidden{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
svg{display:block}

/* ===== أزرار عامة ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:10px 16px;min-height:52px;text-decoration:none;text-align:center;line-height:1.5;
  font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .2s,opacity .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-gold{background:linear-gradient(180deg,#F0D68F 0%,#C99A3B 100%);color:#0B2142;box-shadow:0 6px 16px rgba(201,154,59,.35)}
.btn-gold:disabled{background:var(--pick-soft);color:var(--muted);box-shadow:none;opacity:1}
.btn-navy{background:var(--btn-navy);color:var(--btn-navy-ink)}
.btn-ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn-ghost:hover:not(:disabled){border-color:var(--gold)}
.btn.block{width:100%}
.ibtn{width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(235,203,126,.55);background:rgba(255,255,255,.08);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;transition:background .2s,transform .15s}
.ibtn:hover{background:rgba(255,255,255,.18)}
.ibtn:active{transform:scale(.92)}
.ibtn svg{width:22px;height:22px}

.brandbar{position:fixed;top:0;right:0;left:0;z-index:10;height:var(--bb);padding:env(safe-area-inset-top,0px) 12px 0;display:flex;align-items:center;gap:10px;color:#fff;
  background:linear-gradient(180deg,#0A1D3B,#0B2142);border-bottom:2px solid var(--gold);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.brandbar .bl{width:42px;height:42px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px var(--gold-lt)}
.brandbar .bn{flex:1;min-width:0;font-family:var(--display);font-weight:700;font-size:19px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandbar .bn small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--gold-lt);line-height:1.2}
.brandbar .ibtn{width:40px;height:40px}
/* ===== الواجهة الرئيسية (Hero) ===== */
.hero{position:relative;overflow:hidden;text-align:center;color:#fff;padding:26px 20px 92px;
  background:radial-gradient(900px 420px at 50% -80px,#1E4C93 0%,transparent 70%),linear-gradient(170deg,#0B2142 0%,#0A1B38 100%);
  border-radius:0 0 40px 40px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero::before{width:560px;height:560px;top:-300px;left:-210px;border:1.5px solid rgba(235,203,126,.24)}
.hero::after{width:420px;height:420px;bottom:-190px;right:-170px;border:14px solid rgba(235,203,126,.07)}
.hero>*{position:relative;z-index:1}
.medal{position:relative;width:200px;height:200px;margin:14px auto 22px}
.medal img{width:100%;height:100%;border-radius:50%;display:block;box-shadow:0 0 0 7px rgba(255,255,255,.06),0 22px 44px rgba(0,0,0,.5);
  animation:medalIn 1s cubic-bezier(.2,.8,.2,1) both}
.medal svg{position:absolute;left:-16px;top:-16px;width:232px;height:232px;transform:rotate(-90deg);overflow:visible}
.medal circle{fill:none;stroke:var(--gold-lt);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:703;stroke-dashoffset:703;
  animation:draw 1.9s .15s cubic-bezier(.45,.05,.2,1) forwards;filter:drop-shadow(0 0 6px rgba(235,203,126,.7))}
#start.seen .medal img,#start.seen .heroText{animation:none}
#start.seen .medal circle{animation:none;stroke-dashoffset:0}
@keyframes medalIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
.heroText{animation:textIn .8s 1.1s ease-out both}
@keyframes textIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hero h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(34px,8.5vw,50px);line-height:1.3;color:#fff;letter-spacing:.3px}
.grade{display:inline-block;margin:10px 0 0;padding:4px 18px;border-radius:999px;background:linear-gradient(180deg,#F0D68F,#C99A3B);color:#0B2142;font-weight:700;font-size:15px}
.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:18px 0 0}
.chip{padding:4px 14px;border-radius:999px;font-size:14px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2)}
.lead{margin:20px auto 0;max-width:430px;color:rgba(255,255,255,.88);font-size:16px}

/* ===== قائمة الوحدات ===== */
.sets{max-width:720px;margin:-54px auto 0;padding:0 14px;position:relative;z-index:2}
.setcard{background:var(--card);border:1px solid var(--line);border-radius:20px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden;transition:border-color .2s,transform .2s}
.setcard:hover{border-color:var(--gold)}
.setcard .main{display:flex;align-items:center;gap:14px;width:100%;text-align:right;padding:15px 16px;background:none;border:0;cursor:pointer}
.cnt{flex:0 0 58px;height:58px;border-radius:50%;background:var(--pick-soft);color:var(--pick-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.cnt b{font-family:var(--display);font-size:21px}
.cnt small{font-size:11px;opacity:.85}
.txt{flex:1;min-width:0}
.ttl{display:block;font-family:var(--display);font-weight:700;font-size:19px;line-height:1.5}
.sub{display:block;color:var(--muted);font-size:14.5px;line-height:1.6}
.resume{display:block;margin-top:4px;color:var(--gold-dk);font-size:14px;font-weight:600}
:root[data-theme="dark"] .resume{color:var(--gold-lt)}
.go{flex:0 0 auto;color:var(--gold)}
.go svg{width:22px;height:22px}
.setcard.featured{background:linear-gradient(135deg,#0B2142 0%,#173F7C 100%);border:0;box-shadow:0 14px 30px rgba(11,33,66,.35),inset 0 0 0 1.5px rgba(235,203,126,.55);color:#fff}
.setcard.featured .cnt{background:linear-gradient(180deg,#F0D68F,#C99A3B);color:#0B2142}
.setcard.featured .sub{color:rgba(255,255,255,.8)}
.setcard.featured .resume{color:var(--gold-lt)}
.resbar{display:flex;align-items:center;gap:12px;padding:0 16px 14px}
.mbar{flex:1;height:8px;border-radius:99px;background:var(--pick-soft);overflow:hidden}
.setcard.featured .mbar{background:rgba(255,255,255,.18)}
.mbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#F0D68F,#C99A3B)}
.mini{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:3px 14px;font-size:14px;cursor:pointer;font-weight:600}
.mini:hover{border-color:var(--gold)}
.setcard.featured .mini{border-color:rgba(255,255,255,.35);color:#fff}

/* ===== اختيار نوع الاختبار ===== */
.choose{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.pick{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;padding:18px 10px 16px;min-height:158px;
  border:0;border-radius:24px;cursor:pointer;transition:transform .15s,box-shadow .25s}
.pick:active{transform:scale(.97)}
.pick .pi{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:5px;transition:background .3s,color .3s,transform .4s cubic-bezier(.3,1.5,.5,1)}
.pick .pi svg{width:28px;height:28px}
.pick:hover .pi{transform:rotate(-8deg) scale(1.08)}
.pick b{font-family:var(--display);font-size:19px;line-height:1.4}
.pick small{font-size:13.5px;line-height:1.5;opacity:.88}
.pick-full{background:linear-gradient(135deg,#0B2142 0%,#173F7C 100%);color:#fff;box-shadow:0 14px 30px rgba(11,33,66,.45),inset 0 0 0 1.5px rgba(235,203,126,.6)}
.pick-full .pi{background:linear-gradient(180deg,#F0D68F,#C99A3B);color:#0B2142}
.pick-unit{background:var(--card);color:var(--ink);box-shadow:var(--shadow),inset 0 0 0 1.5px var(--line);padding-bottom:26px}
.pick-unit .pi{background:var(--pick-soft);color:var(--pick-ink)}
.pick-unit .chev{position:absolute;bottom:8px;left:50%;width:18px;height:18px;margin-left:-9px;color:var(--gold);transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.pick-unit[aria-expanded="true"]{box-shadow:var(--shadow),inset 0 0 0 2px var(--gold)}
.pick-unit[aria-expanded="true"] .pi{background:linear-gradient(180deg,#F0D68F,#C99A3B);color:#0B2142}
.pick-unit[aria-expanded="true"] .chev{transform:rotate(180deg)}
.pick-unit.has-progress::after{content:"";position:absolute;top:12px;left:12px;width:11px;height:11px;border-radius:50%;background:var(--gold);animation:glowPulse 2s ease-in-out infinite}
#unitBtn{scroll-margin-top:calc(var(--bb) + 12px)}
.fullres{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:10px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);font-size:14.5px}
.fullres .mbar{min-width:36px}
.fullres span{white-space:nowrap;color:var(--gold-lt);font-weight:600}
.panel{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .5s cubic-bezier(.2,.8,.2,1),visibility 0s .5s}
.panel.open{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .5s cubic-bezier(.2,.8,.2,1),visibility 0s 0s}
.panelin{overflow:hidden;min-height:0;margin:0 -10px;padding:0 10px 14px}
.ph{margin:6px 4px 12px;font-family:var(--display);font-size:20px;font-weight:700}
.panel.open .setcard{animation:optIn .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*70ms + 160ms)}

/* ===== المواد ===== */
.subcard{display:flex;align-items:center;gap:16px;width:100%;text-align:right;padding:18px;border:0;border-radius:26px;cursor:pointer;margin-bottom:14px;color:#fff;
  background:linear-gradient(135deg,#0B2142 0%,#173F7C 100%);box-shadow:0 16px 34px rgba(0,0,0,.45),inset 0 0 0 1.5px rgba(235,203,126,.6);transition:transform .15s}
.subcard:active{transform:scale(.98)}
.subcard .sico{flex:0 0 72px;height:72px;border-radius:50%;background:linear-gradient(180deg,#F0D68F,#C99A3B);color:#0B2142;display:flex;align-items:center;justify-content:center}
.subcard .sico svg{width:42px;height:42px;animation:atom 18s linear infinite}
@keyframes atom{to{transform:rotate(360deg)}}
.subcard .stx{flex:1;min-width:0}
.subcard b{display:block;font-family:var(--display);font-size:30px;line-height:1.3}
.subcard .d{display:block;color:rgba(255,255,255,.85);font-size:15.5px;line-height:1.5}
.subcard .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.subcard .go{color:var(--gold-lt)}
.subhead{max-width:720px;margin:0 auto;padding:20px 14px 14px;display:flex;align-items:center;gap:12px}
.subhead .sico{flex:0 0 54px;height:54px;border-radius:50%;background:linear-gradient(180deg,#F0D68F,#C99A3B);color:#0B2142;display:flex;align-items:center;justify-content:center}
.subhead .sico svg{width:30px;height:30px}
.subhead h2{margin:0;font-family:var(--display);font-size:29px;line-height:1.25}
.subhead .sht span{color:var(--gold-lt);font-size:15px}
#subject .medal img,#subject .heroText{animation:none}
#subject .medal circle{animation:none;stroke-dashoffset:0}
.hero .backBtn{position:absolute;top:14px;right:14px;z-index:2}

/* ===== شاشة الاختبار ===== */
.topbar{position:sticky;top:var(--bb);z-index:6;color:#fff;background:linear-gradient(170deg,#0B2142,#0D2850);
  padding:10px 12px 12px;box-shadow:0 3px 0 var(--gold),0 8px 20px rgba(0,0,0,.18)}
.topin{max-width:720px;margin:0 auto}
.toprow{display:flex;align-items:center;gap:8px}
.topmid{flex:1;text-align:center;min-width:0}
.counter{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.4}
.live{display:flex;justify-content:center;gap:8px;margin-top:2px;font-size:13.5px}
.live span{display:inline-flex;align-items:center;gap:4px;padding:0 10px;border-radius:99px;background:rgba(255,255,255,.1);line-height:1.7}
.live .g{color:#7BE3B5}.live .r{color:#FF9AA2}
.live svg{width:12px;height:12px}
.pbar{height:8px;margin-top:10px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#F0D68F,#C99A3B);transition:width .45s cubic-bezier(.3,.7,.2,1)}
.qwrap{max-width:720px;margin:0 auto;padding:26px 14px 10px}
.qcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px 20px 20px;box-shadow:var(--shadow)}
.qcard.in-next{animation:inNext .38s cubic-bezier(.2,.8,.2,1)}
.qcard.in-prev{animation:inPrev .38s cubic-bezier(.2,.8,.2,1)}
@keyframes inNext{from{opacity:0;transform:translateX(-38px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:0;transform:translateX(38px)}to{opacity:1;transform:none}}
.qnum{position:absolute;top:-15px;right:20px;background:var(--navy);color:var(--gold-lt);font-family:var(--display);font-weight:700;font-size:15px;
  padding:2px 16px;border-radius:999px;box-shadow:0 0 0 3px var(--paper),0 0 0 4.5px var(--gold)}
:root[data-theme="dark"] .qnum{background:#16305C}
.tag{display:inline-block;font-size:13.5px;color:var(--muted);background:var(--pick-soft);padding:1px 12px;border-radius:99px;line-height:1.8}
.qtext{font-family:var(--display);font-weight:700;font-size:clamp(24px,6.4vw,29px);line-height:1.75;margin:14px 0 22px;color:var(--gold-lt);letter-spacing:.2px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);border:2px solid var(--line);border-radius:16px;
  padding:11px 13px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,background .15s,transform .12s}
.opt:hover:not([disabled]){border-color:var(--gold)}
.opt:active:not([disabled]){transform:scale(.985)}
.opt .l{flex:0 0 38px;height:38px;border-radius:50%;background:var(--pick-soft);color:var(--pick-ink);display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:700;font-size:18px;transition:background .15s,color .15s}
.opt .l svg{width:20px;height:20px}
.opt .t{flex:1;line-height:1.7}
.opt.sel{border-color:var(--pick);background:var(--pick-soft)}
.opt.sel .l{background:var(--navy);color:var(--gold-lt)}
:root[data-theme="dark"] .opt.sel .l{background:var(--gold-lt);color:#0B2142}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .l{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt[disabled]:not(.ok):not(.bad){opacity:.62}
.fresh .opt.ok{animation:pop .5s}
.fresh .opt.bad{animation:shake .5s}
@keyframes pop{0%{transform:scale(.97)}55%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.fb{display:flex;gap:12px;align-items:flex-start;border-radius:16px;padding:13px 14px;margin:6px 0 4px;border:1.5px solid}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb.pop{animation:fbIn .4s ease-out}
@keyframes fbIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fb .ic{flex:0 0 34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center}
.fb.ok .ic{background:var(--ok)}.fb.bad .ic{background:var(--bad)}
.fb .ic svg{width:19px;height:19px}
.fb b{display:block;font-size:16.5px;line-height:1.6}
.fb.ok b{color:var(--ok)}.fb.bad b{color:var(--bad)}
.fb span{display:block;font-size:15.5px;line-height:1.75;margin-top:2px}
.actions{position:sticky;bottom:var(--cb);z-index:4;display:flex;gap:10px;padding:14px 0;
  background:linear-gradient(to bottom,transparent,var(--paper) 28%)}
.actions .btn{flex:1}
.actions #prevBtn{flex:0 0 auto;min-width:96px}

/* ===== حركة صفحة الأسئلة ===== */
.qwrap{position:relative;z-index:1}
.live span{position:relative}
#fb{scroll-margin-bottom:calc(var(--cb) + 100px)}
/* خلايا عايمة بالخلفية */
.bgfx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bgfx i{position:absolute;bottom:-140px;border-radius:50%;border:2px solid rgba(201,154,59,.38);
  background:radial-gradient(circle at 35% 30%,rgba(235,203,126,.25),rgba(21,59,115,.07) 70%);animation:floatUp linear infinite}
.bgfx i::after{content:"";position:absolute;width:34%;height:34%;left:36%;top:38%;border-radius:50%;background:rgba(201,154,59,.30)}
@keyframes floatUp{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(var(--sw,40px),-125vh) rotate(70deg);opacity:0}}
/* شريط التقدم لامع */
.pbar i{position:relative;overflow:hidden}
.pbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.65) 50%,transparent 70%);transform:translateX(100%);animation:sweep 2.2s ease-in-out infinite}
@keyframes sweep{to{transform:translateX(-100%)}}
/* دخول السؤال */
.qcard.in-next .qnum,.qcard.in-prev .qnum{animation:badgePop .65s .12s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes badgePop{from{opacity:0;transform:scale(.3) rotate(-10deg)}to{opacity:1;transform:none}}
.qcard.in-next .tag,.qcard.in-prev .tag{animation:textUp .45s .12s backwards}
.qcard.in-next .qtext,.qcard.in-prev .qtext{animation:textUp .55s .2s backwards}
@keyframes textUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.opt.enter{animation:optIn .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*80ms + 260ms)}
@keyframes optIn{from{opacity:0;transform:translateX(46px) scale(.96)}to{opacity:1;transform:none}}
/* اختيار خيار */
.opt.sel{animation:selGlow .6s ease-out}
@keyframes selGlow{from{box-shadow:0 0 0 0 rgba(201,154,59,.65)}to{box-shadow:0 0 0 12px rgba(201,154,59,0)}}
.opt.sel .l{animation:letterPop .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes letterPop{from{transform:scale(.55) rotate(-25deg)}to{transform:none}}
/* رسم علامة الصح */
.fresh .opt.ok .l svg path{stroke-dasharray:26;stroke-dashoffset:26;animation:dashIn .45s .12s ease-out forwards}
.fresh .opt.bad .l svg path{stroke-dasharray:20;stroke-dashoffset:20;animation:dashIn .35s .1s ease-out forwards}
@keyframes dashIn{to{stroke-dashoffset:0}}
.fb.pop .ic{animation:icPop .65s .12s cubic-bezier(.3,1.7,.5,1) backwards}
@keyframes icPop{from{transform:scale(0) rotate(-60deg)}to{transform:none}}
.fb.pop b,.fb.pop span{animation:textUp .45s .2s backwards}
/* وميض البطاقة */
.qcard.flash-ok{animation:okFlash .85s ease-out}
.qcard.flash-bad{animation:badFlash .6s ease-out}
@keyframes okFlash{0%{box-shadow:var(--shadow),0 0 0 0 rgba(15,127,82,.6)}100%{box-shadow:var(--shadow),0 0 0 26px rgba(15,127,82,0)}}
@keyframes badFlash{0%{box-shadow:var(--shadow),0 0 0 0 rgba(200,53,63,.6);transform:translateX(0)}15%{transform:translateX(-7px)}30%{transform:translateX(7px)}45%{transform:translateX(-5px)}60%{transform:translateX(4px)}100%{box-shadow:var(--shadow),0 0 0 26px rgba(200,53,63,0);transform:none}}
/* نجوم الاحتفال */
.sp{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:2px;background:var(--c);pointer-events:none;z-index:3;animation:burst .85s ease-out forwards}
@keyframes burst{0%{opacity:1;transform:translate(0,0) rotate(45deg) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(260deg) scale(.2)}}
/* عدّاد صح/خطأ */
.live span.bump{animation:bump .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:scale(1.4)}100%{transform:scale(1)}}
.plus{position:absolute;top:-6px;right:50%;margin-right:-8px;color:#7BE3B5;font-style:normal;font-weight:700;font-size:15px;animation:plusUp .9s ease-out forwards}
@keyframes plusUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-30px)}}
/* لمعان الأزرار الجاهزة */
#confirmBtn:not(:disabled),#nextBtn{position:relative;overflow:hidden}
#confirmBtn:not(:disabled){animation:ready .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes ready{from{transform:scale(.94)}to{transform:none}}
#confirmBtn:not(:disabled)::after,#nextBtn::after{content:"";position:absolute;top:0;bottom:0;width:55%;left:-70%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:shine 2s ease-in-out infinite}
@keyframes shine{0%{left:-70%}60%,100%{left:140%}}
#nextBtn{animation:ready .5s cubic-bezier(.3,1.6,.5,1)}
/* تشجيع المتتالية */
.toast{position:fixed;left:50%;top:calc(var(--bb) + 128px);z-index:15;transform:translateX(-50%);display:flex;align-items:center;gap:10px;white-space:nowrap;
  padding:8px 20px 8px 16px;border-radius:999px;background:#0B2142;color:var(--gold-lt);border:2px solid var(--gold);box-shadow:0 10px 26px rgba(0,0,0,.35);pointer-events:none;opacity:0}
.toast b{font-family:var(--display);font-size:17px;line-height:1.3;color:#fff}
.toast small{display:block;font-size:12.5px;color:var(--gold-lt);line-height:1.3}
.toast svg{width:26px;height:26px;flex:0 0 auto}
.toast.show{animation:toastLife 2.6s ease both}
@keyframes toastLife{0%{opacity:0;transform:translate(-50%,-18px) scale(.8)}10%{opacity:1;transform:translate(-50%,0) scale(1.08)}16%{transform:translate(-50%,0) scale(1)}84%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-12px)}}

/* ===== زر التحفيز ===== */
.ibtn.cheerBtn{background:linear-gradient(180deg,#F0D68F,#C99A3B);color:#0B2142;border-color:transparent;animation:glowPulse 2.6s ease-in-out infinite}
.ibtn.cheerBtn:hover{background:linear-gradient(180deg,#F6E3A8,#D6A63F)}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(235,203,126,.6)}50%{box-shadow:0 0 0 10px rgba(235,203,126,0)}}
.cheerBtn.spin svg{animation:spinPop .75s cubic-bezier(.3,1.5,.5,1)}
@keyframes spinPop{from{transform:rotate(0) scale(.5)}to{transform:rotate(360deg) scale(1)}}
.cheer{position:fixed;left:12px;top:calc(var(--bb) + 14px);z-index:16;width:min(340px,calc(100vw - 24px));padding:14px 16px 20px 14px;border-radius:22px;display:flex;gap:12px;align-items:center;
  background:linear-gradient(135deg,#F6E3A8 0%,#D9AC4A 100%);color:#0B2142;box-shadow:0 16px 36px rgba(0,0,0,.5);transform-origin:34px -10px;opacity:0;pointer-events:none;visibility:hidden}
.cheer::before{content:"";position:absolute;top:-8px;left:14px;width:18px;height:18px;background:#F6E3A8;transform:rotate(45deg);border-radius:5px 0 0 0}
.cheer.show{visibility:visible;opacity:1;pointer-events:auto;animation:cheerIn .6s cubic-bezier(.3,1.5,.5,1)}
.cheer.hide{visibility:visible;animation:cheerOut .3s ease-in forwards}
@keyframes cheerIn{from{opacity:0;transform:scale(.25) translateY(-16px)}to{opacity:1;transform:none}}
@keyframes cheerOut{to{opacity:0;transform:scale(.85) translateY(-10px)}}
.cheer .em{flex:0 0 46px;height:46px;border-radius:50%;background:#0B2142;display:flex;align-items:center;justify-content:center;font-size:25px;line-height:1}
.cheer.show .em{animation:wiggle .9s .25s ease-in-out}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-16deg) scale(1.15)}40%{transform:rotate(14deg) scale(1.15)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
.cheer p{margin:0;font-family:var(--display);font-weight:700;font-size:17px;line-height:1.7}
.cheer .tm{position:absolute;left:16px;right:16px;bottom:8px;height:3px;border-radius:3px;background:rgba(11,33,66,.2);overflow:hidden}
.cheer .tm i{display:block;height:100%;width:100%;background:#0B2142;border-radius:3px;transform-origin:right}
.cheer.show .tm i{animation:shrink 5s linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}

/* ===== النتيجة ===== */
.rwrap{max-width:560px;margin:0 auto;padding:22px 14px 10px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}
.rhead{position:relative;text-align:center;color:#fff;padding:24px 16px 28px;background:radial-gradient(500px 240px at 50% -40px,#1E4C93 0%,transparent 70%),linear-gradient(170deg,#0B2142,#0A1B38);box-shadow:0 3px 0 var(--gold)}
.rhead .mlogo{width:62px;height:62px;border-radius:50%;margin:0 auto 6px;box-shadow:0 0 0 3px rgba(235,203,126,.5)}
.rhead h2{margin:4px 0 14px;font-family:var(--display);font-size:24px;font-weight:700}
.ring{position:relative;width:190px;height:190px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:rgba(255,255,255,.14);stroke-width:11}
.ring .val{fill:none;stroke:url(#gg);stroke-width:11;stroke-linecap:round;stroke-dasharray:427.3;stroke-dashoffset:427.3}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:50px;color:#fff;direction:ltr}
.rtier{display:inline-block;margin-top:14px;padding:2px 20px;border-radius:999px;background:linear-gradient(180deg,#F0D68F,#C99A3B);color:#0B2142;font-family:var(--display);font-weight:700;font-size:19px}
.rbody{padding:18px 16px 20px}
.rmsg{text-align:center;font-weight:600;margin:0 0 14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--pick-soft);border-radius:16px;padding:10px 6px;text-align:center;font-size:14.5px;line-height:1.5}
.stat b{display:block;font-family:var(--display);font-size:26px;line-height:1.4}
.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--bad)}
.rrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.rrow .btn{flex:1 1 150px;white-space:nowrap}
.wa{background:#1FA855;color:#fff}

/* ===== شريط التواصل الثابت ===== */
.contactbar{position:fixed;bottom:0;right:0;left:0;z-index:10;height:var(--cb);padding:0 12px env(safe-area-inset-bottom,0px);display:flex;align-items:center;justify-content:center;gap:18px;
  background:linear-gradient(0deg,#0A1D3B,#0B2142);border-top:2px solid var(--gold);box-shadow:0 -6px 18px rgba(0,0,0,.25)}
.contactbar a{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;
  background:rgba(255,255,255,.08);border:1.5px solid rgba(235,203,126,.65);transition:transform .15s,background .2s}
.contactbar a:hover{background:rgba(255,255,255,.2)}
.contactbar a:active{transform:scale(.92)}
.contactbar a.call{background:linear-gradient(180deg,#F0D68F,#C99A3B);color:#0B2142;border-color:transparent}
.contactbar svg{width:23px;height:23px}

/* ===== قائمة الأسئلة ===== */

/* إنهاء الاختبار + ملخص الحل */
.finbtn{width:100%;margin-top:14px;min-height:48px;font-size:16px}
.rsum{margin-top:18px;border:1.5px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden}
.rsum>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-family:var(--display);font-weight:700;font-size:18px}
.rsum>summary::-webkit-details-marker{display:none}
.rsum>summary::after{content:"\25BE";color:var(--gold);transition:transform .25s}
.rsum[open]>summary::after{transform:rotate(180deg)}
.rsum .sbody{padding:0 12px 12px}
.sfilt{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 12px}
.sfilt button{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:3px 14px;font:inherit;font-size:14px;cursor:pointer}
.sfilt button.on{background:var(--gold);border-color:var(--gold);color:#0B2142;font-weight:700}
.srow{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:14px;margin-bottom:8px;border:1.5px solid var(--line)}
.srow.ok{background:var(--ok-soft);border-color:var(--ok)}
.srow.bad{background:var(--bad-soft);border-color:var(--bad)}
.srow .sn{flex:0 0 auto;min-width:38px;height:30px;padding:0 8px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:var(--pick-soft);color:var(--ink)}
.srow.ok .sn{background:var(--ok);color:#fff}.srow.bad .sn{background:var(--bad);color:#fff}
.srow .sq{font-weight:700;font-size:15.5px;line-height:1.7}
.srow .sa{display:block;font-size:14.5px;line-height:1.7;margin-top:2px;color:var(--muted)}
.srow.ok .sa.y{color:var(--ok)}.srow.bad .sa.y{color:var(--bad)}
.srow .sa.c{color:var(--ok);font-weight:600}
.sempty{text-align:center;color:var(--muted);padding:14px 0;font-size:15px}
.cfm{margin:6px 0 14px;font-size:16.5px;line-height:1.8}
.cfm b{color:var(--gold-dk)}
:root[data-theme="dark"] .cfm b{color:var(--gold-lt)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,14,30,.62);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{width:100%;max-width:720px;background:var(--card);border-radius:26px 26px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--gold);animation:sheetIn .3s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetIn{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheethead b{font-family:var(--display);font-size:20px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);margin:2px 0 12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-left:5px;vertical-align:-1px;border:1.5px solid var(--line)}
.legend .a{background:var(--ok-soft);border-color:var(--ok)}.legend .b{background:var(--bad-soft);border-color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:8px;max-height:58vh;overflow:auto;padding:4px}
.gn{border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:8px 0;font-size:15px;font-weight:600;cursor:pointer}
.gn.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.gn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.gn.cur{outline:3px solid var(--gold);outline-offset:1px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

@media (min-width:700px){
  .hero{padding-bottom:104px}
  .qcard{padding:34px 30px 24px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .medal circle{stroke-dashoffset:0}
}

    var gi = setIdx[pos], q = Q[gi], done = answers.hasOwnProperty(gi), n = Object.keys(answers).length;
    var ok = 0, bad = 0;
    setIdx.forEach(function(g){ if(answers.hasOwnProperty(g)){ if(answers[g]===Q[g].a) ok++; else bad++; } });
    $('counter').textContent = 'السؤال '+(pos+1)+' من '+setIdx.length;
    $('barFill').style.width = (n/setIdx.length*100)+'%';
    $('okCnt').textContent = ok; $('badCnt').textContent = bad;
    $('qnum').textContent = 'رقم '+(gi+1);
    $('secTag').textContent = q.l || SECS[q.s];
    $('qtext').textContent = q.q;
    var box = $('opts'); box.innerHTML=''; box.className = fresh ? 'fresh' : '';
    q.o.forEach(function(t,i){
      var b = el('button','opt'); b.type='button';
      if(dir){ b.classList.add('enter'); b.style.setProperty('--i', i); }
      var l = el('span','l'); l.textContent = LET[i];
      var tx = el('span','t'); tx.textContent = t;
      b.appendChild(l); b.appendChild(tx);
      if(done){
        b.disabled = true;
        if(i===q.a){ b.classList.add('ok'); l.innerHTML = CHECK; }
        else if(i===answers[gi]){ b.classList.add('bad'); l.innerHTML = CROSS; }
      } else {
        if(i===sel) b.classList.add('sel');
        b.onclick = function(){ sel=i; if(navigator.vibrate){ try{ navigator.vibrate(8); }catch(e){} } render(); };
      }
      box.appendChild(b);
    });
    var fb = $('fb');
    if(done){
      var okk = answers[gi]===q.a;
      fb.className = 'fb '+(okk?'ok':'bad')+(fresh?' pop':'');
      fb.innerHTML = '<div class="ic">'+(okk?CHECK:CROSS)+'</div><div><b></b><span></span></div>';
      fb.querySelector('b').textContent = okk ? 'إجابة صحيحة' : 'إجابة خاطئة، الإجابة الصحيحة: '+LET[q.a]+') '+q.o[q.a];
      fb.querySelector('span').textContent = q.e;
      if(fresh && !okk && navigator.vibrate){ try{ navigator.vibrate(120); }catch(e){} }
    } else fb.className='hidden';
    $('confirmBtn').classList.toggle('hidden', done); $('confirmBtn').disabled = (sel===null);
    $('nextBtn').classList.toggle('hidden', !done);
    $('nextBtn').textContent = (pos===setIdx.length-1) ? 'عرض النتيجة' : 'السؤال التالي';
    $('prevBtn').disabled = pos===0;
    if(dir){ var c=$('qcard'); c.classList.remove('in-next','in-prev','flash-ok','flash-bad'); void c.offsetWidth; c.classList.add(dir); }
  }
  $('confirmBtn').onclick = function(){
    if(sel===null) return;
    var gi = setIdx[pos], okk = (sel===Q[gi].a);
    answers[gi] = sel; sel=null; persist(); render(null,true);
    feedbackFx(okk);
  };

  /* ===== المؤثرات ===== */
  function bump(s){ var e=document.querySelector(s); if(!e) return; e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump'); return e; }
  function burst(btn){
    if(reduce || !btn) return;
    var card=$('qcard'), cr=card.getBoundingClientRect(), br=btn.querySelector('.l').getBoundingClientRect();
    var cx=br.left-cr.left+br.width/2, cy=br.top-cr.top+br.height/2, cols=['#EBCB7E','#C99A3B','#3FB984','#FFFFFF'], k;
    for(k=0;k<16;k++){
      var s=document.createElement('i'), a=k/16*6.283+Math.random()*.4, d=46+Math.random()*58;
      s.className='sp';
      s.style.cssText='left:'+cx+'px;top:'+cy+'px;--dx:'+(Math.cos(a)*d)+'px;--dy:'+(Math.sin(a)*d)+'px;--c:'+cols[k%4]+';animation-delay:'+(Math.random()*.08)+'s';
      card.appendChild(s);
      (function(n){ setTimeout(function(){ if(n.parentNode) n.parentNode.removeChild(n); }, 1100); })(s);
    }
  }
  var toastT = null;
  var STAR = '<svg viewBox="0 0 24 24" fill="#EBCB7E"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg>';
  function toast(n){
    var sub = {3:'بداية قوية',5:'تركيزك عالي',7:'أداء رائع',10:'أنت متفوق',15:'ما شاء الله',20:'مستوى استثنائي'}[n] || 'استمر على هالمستوى';
    var tt = $('toast');
    tt.innerHTML = STAR+'<div><b>'+n+(n<=10?' إجابات':' إجابة')+' صحيحة متتالية</b><small>'+sub+'</small></div>';
    tt.classList.remove('show'); void tt.offsetWidth; tt.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function(){ tt.classList.remove('show'); }, 2700);
  }
  function feedbackFx(okk){
    var card=$('qcard');
    card.classList.remove('in-next','in-prev','flash-ok','flash-bad'); void card.offsetWidth;
    card.classList.add(okk?'flash-ok':'flash-bad');
    setTimeout(function(){ card.classList.remove('flash-ok','flash-bad'); }, 900);
    if(okk){
      streak++;
      var chip = bump('.live .g');
      if(chip && !reduce){ var p=document.createElement('i'); p.className='plus'; p.textContent='+1'; chip.appendChild(p); setTimeout(function(){ if(p.parentNode) p.parentNode.removeChild(p); }, 950); }
      burst($('opts').querySelector('.opt.ok'));
      if(streak>=3 && (streak===3 || streak===7 || streak%5===0)) toast(streak);
    } else { streak = 0; bump('.live .r'); }
    setTimeout(function(){ var f=$('fb'); if(f && f.scrollIntoView) f.scrollIntoView({behavior:'smooth',block:'nearest'}); }, 320);
  }
  $('nextBtn').onclick = function(){
    if(pos<setIdx.length-1){ pos++; sel=null; persist(); render('in-next'); window.scrollTo(0,0); }
    else finish();
  };
  $('prevBtn').onclick = function(){ if(pos>0){ pos--; sel=null; persist(); render('in-prev'); window.scrollTo(0,0);} };
  $('homeIcon').onclick = function(){ renderSets(); show('subject'); };

  /* النتيجة */
  function finish(){
    var ok=0,bad=0; setIdx.forEach(function(g){ if(answers.hasOwnProperty(g)){ if(answers[g]===Q[g].a) ok++; else bad++; } });
    var un = setIdx.length-ok-bad; var pct = Math.round(ok/setIdx.length*100);
    $('rTotal').textContent=setIdx.length; $('rOk').textContent=ok; $('rBad').textContent=bad+(un?(' (+'+un+' بلا إجابة)'):'');
    $('msg').textContent = pct>=90?'ممتاز! أداء رائع':pct>=75?'جيد جدًا، تابع التقدم':pct>=50?'مقبول، راجع الأسئلة الخاطئة':'تحتاج إلى مزيد من المراجعة';
    $('tier').textContent = pct>=90?'ممتاز':pct>=75?'جيد جدًا':pct>=50?'مقبول':'تحتاج مراجعة';
    $('reviewBtn').classList.toggle('hidden', bad===0);
    $('shareBtn').href = 'https://wa.me/?text='+encodeURIComponent('حصلت على '+pct+'% ('+ok+' من '+setIdx.length+') في اختبار '+(curSub?curSub.name:'')+' للصف التاسع مع الأستاذ عبد السلام دلله');
    buildSummary();
    show('result');
    var C = 427.3, rv = $('ringVal'); rv.style.strokeDashoffset = C; $('pct').textContent = '0';
    var dur = reduce ? 1 : 1400, t0 = null;
    function step(t){
      if(t0===null) t0=t; var k = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-k,3);
      $('pct').textContent = Math.round(pct*e);
      rv.style.strokeDashoffset = C - C*(pct/100)*e;
      if(k<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
    if(pct>=75 && !reduce) setTimeout(confetti, 500);
  }
  $('restartBtn').onclick = function(){ begin(setIdx.slice(), setKey, false); };
  $('homeBtn').onclick = function(){ renderSets(); show('subject'); };
  $('reviewBtn').onclick = function(){
    var wrong = setIdx.filter(function(g){ return answers.hasOwnProperty(g) && answers[g]!==Q[g].a; });
    begin(wrong, 'wrong', false);
  };


  /* ملخص الحل */
  var sFilter = 'all';
  function buildSummary(){
    sFilter = 'all';
    var cnt = {all:setIdx.length, ok:0, bad:0, none:0};
    setIdx.forEach(function(g){ if(!answers.hasOwnProperty(g)) cnt.none++; else if(answers[g]===Q[g].a) cnt.ok++; else cnt.bad++; });
    var f = $('sfilt'); f.innerHTML='';
    [['all','الكل'],['ok','صحيحة'],['bad','خاطئة'],['none','بلا إجابة']].forEach(function(x){
      if(x[0]!=='all' && !cnt[x[0]]) return;
      var b = el('button'); b.type='button'; b.textContent = x[1]+' ('+cnt[x[0]]+')'; b.dataset.k = x[0];
      if(x[0]==='all') b.className='on';
      b.onclick = function(){ sFilter = x[0]; Array.prototype.forEach.call(f.children,function(c){ c.classList.toggle('on', c===b); }); renderSummary(); };
      f.appendChild(b);
    });
    $('rsum').open = setIdx.length<=60;
    renderSummary();
  }
  function renderSummary(){
    var box = $('slist'); box.innerHTML=''; var shown = 0;
    setIdx.forEach(function(g, p){
      var q = Q[g], has = answers.hasOwnProperty(g), okk = has && answers[g]===q.a;
      var st = !has ? 'none' : (okk ? 'ok' : 'bad');
      if(sFilter!=='all' && sFilter!==st) return;
      shown++;
      var row = el('div','srow '+(st==='none'?'':st));
      var n = el('span','sn'); n.textContent = (g+1);
      var c = el('div'); var qq = el('span','sq'); qq.textContent = q.q; c.appendChild(qq);
      var a1 = el('span','sa y');
      a1.textContent = has ? 'إجابتك: '+LET[answers[g]]+') '+q.o[answers[g]]+(okk?' ✓':' ✗') : 'لم تُجب عن هذا السؤال';
      c.appendChild(a1);
      if(!okk){ var a2 = el('span','sa c'); a2.textContent = 'الإجابة الصحيحة: '+LET[q.a]+') '+q.o[q.a]; c.appendChild(a2); }
      row.appendChild(n); row.appendChild(c); box.appendChild(row);
    });
    if(!shown){ var e = el('div','sempty'); e.textContent='لا توجد أسئلة'; box.appendChild(e); }
  }

  /* زر إنهاء الاختبار */
  $('finishBtn').onclick = function(){
    var n = Object.keys(answers).length, un = setIdx.length-n;
    if(un<=0){ finish(); return; }
    $('finMsg').innerHTML = 'أجبت عن <b>'+n+'</b> من <b>'+setIdx.length+'</b> سؤال، وتبقّى <b>'+un+'</b> بلا إجابة. ستُحسب الأسئلة غير المجابة كأنها لم تُحل.';
    $('finModal').classList.remove('hidden');
  };
  $('finNo').onclick = function(){ $('finModal').classList.add('hidden'); };
  $('finYes').onclick = function(){ $('finModal').classList.add('hidden'); finish(); };
  $('finModal').addEventListener('click', function(e){ if(e.target===$('finModal')) $('finModal').classList.add('hidden'); });

  /* قائمة الأسئلة */
  function openGrid(){
    var g=$('grid'); g.innerHTML='';
    setIdx.forEach(function(gi,p){
      var b=el('button','gn'); b.type='button'; b.textContent=gi+1;
      if(answers.hasOwnProperty(gi)) b.classList.add(answers[gi]===Q[gi].a?'ok':'bad');
      if(p===pos) b.classList.add('cur');
      b.onclick=function(){ pos=p; sel=null; closeGrid(); persist(); render('in-next'); window.scrollTo(0,0); };
      g.appendChild(b);
    });
    $('modal').classList.remove('hidden');
    var cur = g.querySelector('.cur'); if(cur && cur.scrollIntoView) cur.scrollIntoView({block:'center'});
  }
  function closeGrid(){ $('modal').classList.add('hidden'); }
  $('gridBtn').onclick = openGrid;
  $('closeGrid').onclick = closeGrid;
  $('modal').addEventListener('click', function(e){ if(e.target===$('modal')) closeGrid(); });

  /* لوحة المفاتيح: 1-4 للاختيار، Enter للتأكيد/التالي */
  document.addEventListener('keydown', function(e){
    if(!$('modal').classList.contains('hidden')){ if(e.key==='Escape') closeGrid(); return; }
    if($('quiz').classList.contains('hidden')) return;
    var gi = setIdx[pos], done = answers.hasOwnProperty(gi);
    if(e.key>='1' && e.key<='4' && !done){ sel = +e.key-1; render(); }
    else if(e.key==='Enter' && document.activeElement.tagName!=='BUTTON'){
      if(done) $('nextBtn').click(); else if(sel!==null) $('confirmBtn').click();
    }
  });

  /* احتفال النتيجة */
  function confetti(){
    var c=$('confetti'), x=c.getContext('2d'), dpr=Math.min(window.devicePixelRatio||1,2);
    var w=window.innerWidth, h=window.innerHeight; c.width=w*dpr; c.height=h*dpr; x.setTransform(dpr,0,0,dpr,0,0);
    c.classList.remove('hidden');
    var cols=['#EBCB7E','#C99A3B','#F6E3A8','#153B73','#FFFFFF','#3FB984'], P=[], i;
    for(i=0;i<140;i++) P.push({x:Math.random()*w,y:-20-Math.random()*h*.5,vx:(Math.random()-.5)*3.5,vy:2+Math.random()*4,s:6+Math.random()*7,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,c:cols[i%cols.length],round:Math.random()<.3});
    var start=null;
    (function loop(t){
      if(start===null) start=t; var el_=t-start; x.clearRect(0,0,w,h); var alive=false;
      P.forEach(function(p){
        p.x+=p.vx; p.y+=p.vy; p.vy+=.04; p.r+=p.vr;
        if(p.y<h+20) alive=true;
        x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c;
        if(p.round){ x.beginPath(); x.arc(0,0,p.s/2,0,6.28); x.fill(); } else x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);
        x.restore();
      });
      if(alive && el_<5000) requestAnimationFrame(loop); else { x.clearRect(0,0,w,h); c.classList.add('hidden'); }
    })(performance.now());
  }
})();
</script>
